# Proxmox VE VM configuration – Ubuntu Server with RTX 5060 Ti eGPU passthrough
#
# File location: /etc/pve/qemu-server/<VMID>.conf
#
# Before using:
#   1. Replace the hostpci0 PCI address (e.g. 01:00) with the actual address
#      of your RTX 5060 Ti:  lspci | grep -i nvidia
#   2. Adjust 'cores', 'memory', and 'net0' to match your hardware.
#   3. Create or attach a disk:
#        qm importdisk <VMID> /path/to/ubuntu-server.img local-lvm
#      then update the 'scsi0' line accordingly.

agent: 1
balloon: 0
bios: ovmf
boot: order=scsi0;ide2;net0
cores: 8
cpu: host
efidisk0: local-lvm:vm-100-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
ide2: local:iso/ubuntu-24.04-live-server-amd64.iso,media=cdrom
machine: q35
memory: 16384
name: ubuntu-egpu
net0: virtio,bridge=vmbr0
numa: 0
ostype: l26
# PCIe passthrough of RTX 5060 Ti.
# Specifying the slot without a function suffix (e.g. '01:00') tells Proxmox
# to pass through ALL functions of that device – both the GPU (01:00.0) and
# its HDMI audio controller (01:00.1) – in a single hostpci line.
# 'pcie=1' uses PCIe rather than PCI; 'x-vga=1' enables primary GPU mode.
# Replace '01:00' with the actual PCIe slot reported by lspci.
hostpci0: 01:00,pcie=1,x-vga=1
scsi0: local-lvm:vm-100-disk-1,cache=writeback,discard=on,iothread=1,size=64G
scsihw: virtio-scsi-single
smbios1: uuid=00000000-0000-0000-0000-000000000000
sockets: 1
vga: none
