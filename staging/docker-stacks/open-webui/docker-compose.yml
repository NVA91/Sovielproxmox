# Open WebUI — Frontend für Ollama
# Kein Port-Publish! Zugang nur via WireGuard-Tunnel → Traefik (VPS)
# Voraussetzung: n8n_backend-Netzwerk existiert (docker network create n8n_backend)

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY}
      # Optional: Authentifizierung erzwingen
      # - WEBUI_AUTH=true
    # ports:           # ← KEIN publish — nur intern
    #   - "3000:8080"
    depends_on:
      - ollama
    networks:
      - backend

  # Ollama wird im eigenen Stack verwaltet (tools/ollama/)
  # Hier nur als externe Referenz über das gemeinsame Netzwerk

volumes:
  open-webui:

networks:
  backend:
    name: n8n_backend
    external: true
